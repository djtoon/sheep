<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="screen-orientation" content="landscape">
<title>Armed and Fluffy</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080c; overflow: hidden; }
  #game { width: 100vw; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  body.touch, body.touch * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }

  /* on-screen controls (touch devices only) - chunky pixel-style, translucent so the action shows through */
  .tc-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-family: "Courier New", monospace; font-weight: bold; }
  .tc-root > * { pointer-events: auto; position: absolute; }
  .tc-pad { left: calc(env(safe-area-inset-left) + 2.5vmin); bottom: 3vmin; width: 36vmin; height: 36vmin; max-width: 190px; max-height: 190px; }
  .tc-pad-h, .tc-pad-v { position: absolute; background: rgba(20, 22, 30, .55); border: 3px solid rgba(240, 230, 200, .55); box-sizing: border-box; border-radius: 6px; }
  .tc-pad-h { left: 0; right: 0; top: 33%; height: 34%; }
  .tc-pad-v { top: 0; bottom: 0; left: 33%; width: 34%; }
  .tc-pad-hub { position: absolute; left: 36%; top: 36%; width: 28%; height: 28%; background: rgba(20, 22, 30, .6); }
  .tc-arrow { position: absolute; width: 0; height: 0; border: 7px solid transparent; opacity: .8; }
  .tc-arrow.on { opacity: 1; filter: drop-shadow(0 0 0 #ffd040); }
  .tc-up { left: calc(50% - 7px); top: 8%; border-bottom: 10px solid #f0e6c8; border-top: 0; }
  .tc-down { left: calc(50% - 7px); bottom: 8%; border-top: 10px solid #f0e6c8; border-bottom: 0; }
  .tc-left { top: calc(50% - 7px); left: 8%; border-right: 10px solid #f0e6c8; border-left: 0; }
  .tc-right { top: calc(50% - 7px); right: 8%; border-left: 10px solid #f0e6c8; border-right: 0; }
  .tc-up.on { border-bottom-color: #ffd040; } .tc-down.on { border-top-color: #ffd040; }
  .tc-left.on { border-right-color: #ffd040; } .tc-right.on { border-left-color: #ffd040; }
  .tc-btn { width: 17vmin; height: 17vmin; max-width: 92px; max-height: 92px; border-radius: 50%; box-sizing: border-box;
    border: 3px solid rgba(240, 230, 200, .6); display: flex; align-items: center; justify-content: center;
    color: #f0e6c8; font-size: min(3.4vmin, 17px); letter-spacing: 1px; text-shadow: 2px 2px 0 #000; }
  .tc-btn.on { transform: translateY(2px); border-color: #ffd040; color: #ffd040; }
  .tc-fire { right: calc(env(safe-area-inset-right) + 3vmin); bottom: 13vmin; background: rgba(170, 36, 30, .55); }
  .tc-jump { right: calc(env(safe-area-inset-right) + 22vmin); bottom: 3vmin; background: rgba(40, 90, 170, .55); }
  .tc-fire.on { background: rgba(220, 60, 40, .75); } .tc-jump.on { background: rgba(70, 130, 220, .75); }
  .tc-start { left: 50%; transform: translateX(-50%); bottom: 1.5vmin; top: auto; width: 11vmin; height: 7vmin; max-width: 60px; max-height: 36px;
    border-radius: 8px; background: rgba(20, 22, 30, .55); font-size: min(3vmin, 15px); }
  .tc-start.on { transform: translateX(-50%) translateY(2px); }

  /* rotate-to-landscape screen */
  .tc-rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #07080c; color: #ffd040;
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font-family: "Courier New", monospace; font-weight: bold; letter-spacing: 2px; }
  .tc-rotate.show { display: flex; }
  .tc-rotate p { margin: 18px 16px 0; font-size: 20px; text-shadow: 3px 3px 0 #7a2a10; }
  .tc-rotate .tc-sub { font-size: 12px; color: #f0e6c8; text-shadow: none; margin-top: 10px; }
  .tc-phone { width: 54px; height: 92px; border: 5px solid #f0e6c8; border-radius: 9px; box-sizing: border-box; padding: 6px 4px;
    animation: tc-turn 2.2s steps(1, end) infinite; }
  .tc-screen { width: 100%; height: 100%; background: #2a6a3a; }
  @keyframes tc-turn { 0%, 30% { transform: rotate(0deg); } 30.01%, 45% { transform: rotate(-45deg); } 45.01%, 100% { transform: rotate(-90deg); } }
</style>
</head>
<body>
<div id="game"></div>
<script src="lib/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
