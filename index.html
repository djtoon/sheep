<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="screen-orientation" content="landscape">
<title>Armed and Fluffy</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080c; overflow: hidden; }
  #game { width: 100vw; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  body.touch, body.touch * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }

  /* pixel-art UI (drawn in src/touch.js at low res), scaled by an integer --px so pixels stay square */
  :root { --px: 3px; }
  .px { background-repeat: no-repeat; background-size: 100% 100%; image-rendering: pixelated; image-rendering: crisp-edges; }

  /* on-screen controls (touch devices only) */
  .tc-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .tc-root > * { pointer-events: auto; position: absolute; opacity: .82; }
  .tc-pad { left: calc(env(safe-area-inset-left) + 2 * var(--px)); bottom: calc(3 * var(--px)); width: calc(48 * var(--px)); height: calc(50 * var(--px)); }
  .tc-btn { width: calc(34 * var(--px)); height: calc(36 * var(--px)); }
  .tc-fire { right: calc(env(safe-area-inset-right) + 2 * var(--px)); bottom: calc(18 * var(--px)); }
  .tc-jump { right: calc(env(safe-area-inset-right) + 36 * var(--px)); bottom: calc(2 * var(--px)); }
  .tc-start, .tc-fs { width: calc(20 * var(--px)); height: calc(16 * var(--px)); bottom: calc(2 * var(--px)); }
  .tc-start { left: calc(50% - 10 * var(--px)); }
  .tc-fs { left: calc(50% + 12 * var(--px)); }
  .tc-fs.hide { display: none; }

  /* rotate-to-landscape screen */
  .tc-rotate { display: none; position: fixed; inset: 0; z-index: 30; background: #07080c;
    flex-direction: column; align-items: center; justify-content: center; gap: calc(6 * var(--px)); }
  .tc-rotate.show { display: flex; }
  .tc-phone { width: calc(24 * var(--px)); height: calc(16 * var(--px)); animation: tc-turn 2.4s steps(1, end) infinite; }
  .tc-rtext { width: calc(109 * var(--px)); height: calc(9 * var(--px)); }
  .tc-rsub { width: calc(109 * var(--px) * .6); height: calc(9 * var(--px) * .6); }
  @keyframes tc-turn { 0%, 35% { transform: rotate(90deg); } 35.01%, 50% { transform: rotate(45deg); } 50.01%, 100% { transform: rotate(0deg); } }

  /* tap-to-play gate (opens fullscreen + landscape lock + audio from a real user gesture) */
  .tc-gate { position: fixed; inset: 0; z-index: 20; background: rgba(7, 8, 12, .6);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 18vh; box-sizing: border-box; gap: calc(6 * var(--px)); transition: opacity .2s steps(3); }
  .tc-gate.out { opacity: 0; }
  .tc-gbtn { width: calc(78 * var(--px)); height: calc(22 * var(--px)); animation: tc-blink 1s steps(1, end) infinite; }
  .tc-gnote { width: calc(121 * var(--px) * .6); height: calc(9 * var(--px) * .6); }
  @keyframes tc-blink { 0%, 70% { filter: none; } 70.01%, 100% { filter: brightness(1.25); } }
</style>
</head>
<body>
<div id="game"></div>
<script src="lib/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
